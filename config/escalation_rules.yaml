timezone: Asia/Kolkata
business_hours:
  weekdays: [Monday, Tuesday, Wednesday, Thursday, Friday, Saturday]
  start: "11:00"
  end: "19:00"
  assumption: "Monday-Saturday is assumed because official support days were not supplied; confirm with the team."
sla_hours: {P1: 4, P2: 8}
sla_business_days: {P3: 1, P4: 2}
rules:
  R1:
    patterns: ["\\b(talk to|speak to|connect me to|transfer me to) ((a|an) )?(human|agent|representative|real person)\\b", "\\b(call me|human please|agent please)\\b", "insaan se baat karni hai", "\\bbaat karni hai\\b", "किसी इंसान से बात", "मानव एजेंट"]
  R2:
    patterns: ["\\b(idiot|stupid|useless|damn|hell|angry|furious|fed up|threaten to quit|I will quit|I am quitting|cancel everything)\\b", "!{3,}", "\\b(gali|bakwas|bekaar|bahut gussa|tang aa gaya|band kar dunga)\\b", "बहुत गुस्सा", "बंद कर दूंगा"]
  R3:
    patterns: ["\\b(go to|take this to|file a complaint with|report this to|contact) (the )?(consumer court|police|cyber crime|RBI)\\b", "\\b(fil(e|ing)|send|issue|serve) (a )?(police|cyber crime|legal) complaint\\b|\\b(send|file|issue) (a )?legal notice\\b|\\b(fil(e|ing)|file) (a )?chargeback\\b", "\\b(sue you|post( this)? on linkedin|post( this)? on twitter|post a review|leave a review)\\b", "consumer forum me shikayat", "उपभोक्ता अदालत जाऊंगा", "पुलिस में शिकायत करूंगा", "कानूनी नोटिस भेजूंगा"]
  R4_MONEY:
    patterns: ["\\b(debited|deducted|cut|charged|paid|money gone|lost money|money lost|paisa kat|paise kat|payment cut|amount deducted)\\b", "पैसे कट", "रकम कट"]
  R4_ACCESS:
    patterns: ["\\b(no access|cannot access|can't access|didn't get access|did not get access|access not received|access not provided|no receipt|not enrolled|not enrolled|enrolment missing|login nahi|access nahi|receipt nahi|enrollment nahi)\\b", "एक्सेस नहीं", "रसीद नहीं", "नामांकन नहीं"]
  R5:
    patterns: ["\\b(scam|fraud|fake|cheat|cheating)\\b|फ्रॉड|धोखा"]
  R6_ACTION:
    patterns: ["\\b(refund (me|my|do|please)|want a refund|give my money back|cancel my (enrolment|enrollment|admission)|refund chahiye|refund do|paise wapas|paisa wapas|enrolment cancel|enrollment cancel)\\b", "रिफंड चाहिए", "पैसे वापस"]
  R6_POLICY:
    patterns: ["\\b(refund policy|refund rules|refund eligibility|can i get a refund|refund kab|refund kitne din)\\b", "refund policy kya", "रिफंड नीति", "रिफंड पॉलिसी"]
  R7:
    patterns: ["\\b(otp|one[- ]time password|cvv|cvc|aadhaar|aadhar|pan card|password|passwd|passcode)\\b", "ओटीपी", "आधार", "पासवर्ड"]
  R8:
    patterns: ["\\b(i want to die|i am going to kill myself|kill myself|hurt myself|i will self[- ]?harm|end my life|cant go on living)\\b", "मैं आत्महत्या करूंगा", "मैं आत्महत्या करूंगी", "खुद को मार लूंगा", "खुद को मार लूंगी", "जीना नहीं चाहता", "जीना नहीं चाहती"]
  R11:
    patterns: ["\\b(payment status|certificate status|status of my payment|where is my certificate|mera payment status|certificate kab milega|payment ka status)\\b", "मेरे भुगतान की स्थिति", "सर्टिफिकेट की स्थिति"]
  R12_DUPLICATE_PAYMENT:
    patterns: ["\\b(duplicate payment|double payment|paid twice|charged twice|debited twice|billed (?:twice|two times)|charged two times|debited two times|two payments|payment twice|payment (is )?duplicated|duplicated payment|both payments|two charges)\\b", "do baar payment", "paise do baar kat", "दो बार भुगतान", "डबल पेमेंट"]
  R13_LOCATION_CONFLICT:
    patterns: ["\\b(office address|office location|where is (your|the) office|where is .{0,40}office|pune or ahmednagar|office in (pune|ahmednagar))\\b", "office kahan hai", "office ka address"]
  R14_OUT_OF_SCOPE:
    patterns: ["\\b(college partnership|campus partnership|corporate partnership|employer partnership|partnership for (our|my|the) college|partnership with (our|my|the) college|we want to hire|recruiter|hire interns|company partnership|company needs interns|company need interns|employer needs interns)\\b", "\\b(college|corporate|campus|employer).{0,25}(partnership|partner|collaborat\\w*)\\b", "\\b(partnership|partner|collaborat\\w*).{0,25}(college|corporate|campus|employer)\\b", "\\b(company|employer).{0,30}(hire|recruit|interns)\\b", "college ke saath partnership", "campus partnership chahiye"]
  R15_ISTUDIO_PLUS:
    patterns: ["\\biStudio Plus\\b", "\\bistudio plus\\b"]
