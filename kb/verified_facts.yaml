verified_facts:
  facts:
  - id: F1
    text: Brand iStudio means Internship Studio; official site, help-center home, and verified section URLs (internship-related,
      certificates, payment-related, skill, extension, placement assistance, offer letter, project, iCAT, curriculum,
      internship simulation, refund program, and referral) are supplied below.
    source: internshipstudio.com and user-provided verified Internship Studio help-center URLs in Stage 9A instructions
    retrieved: 2026-10-25
    confidence: high
  - id: F2
    text: Support email contact@internshipstudio.com, phone 7507869003, hours 11 AM-7 PM; operating days are not
      stated.
    source: Internship Studio help-center support information (user-supplied)
    retrieved: 2026-10-25
    confidence: medium
  - id: F3
    text: Password reset page is the supplied Internship Studio login forgot-password page.
    source: Internship Studio help article (user-supplied)
    retrieved: 2026-10-25
    confidence: medium
  - id: F4
    text: Location references conflict between Pune and a registered office in Ahmednagar; the bot must not state
      an office address.
    source: Internshala listing and Internship Studio About page (user-supplied)
    retrieved: 2026-10-25
    confidence: low
  - id: F5
    text: Learners take iCAT (Internship Common Aptitude Test), run with Skill Universe per the site footer. Qualifiers
      get training and an internship opportunity; not attempting iCAT means not eligible. The internship itself
      has no charge; the fee is for accompanying training. There is no stipend. After completing training and internship,
      learners get hiring-portal access to apply for stipend-based internships and jobs.
    source: Internship Studio official site and site footer (user-supplied)
    retrieved: 2026-10-25
    confidence: high
  - id: F6
    text: The August 2026 iCAT page snapshot lists Rs 880 for an iCAT-qualified student and Rs 8,500 for a regular
      student. Fees can change. An older third-party review claimed Rs 980 and is not used as the current fee.
    source: Internship Studio iCAT page snapshot, August 2026; older third-party review noted by user (user-supplied)
    retrieved: 2026-10-25
    confidence: medium
  - id: F7
    text: The supplied help-center list has 24 domains while the About page says 25+; the list can change.
    source: Internship Studio help center and About page (user-supplied)
    retrieved: 2026-10-25
    confidence: medium
  - id: F8
    text: 'Three certificates are described: iCAT Participation for everyone who takes iCAT, Training after training,
      and Internship after mentor review and project approval. iStudio describes these as ISO-verified. Supplied
      sources make no AICTE, UGC, or NSDC claim; do not infer accreditation.'
    source: Internship Studio certificate information and user-supplied review of accreditation claims
    retrieved: 2026-10-25
    confidence: high
  - id: F9
    text: 'Standard policy says course/service cancellation payments are non-refundable. Exception: duplicate payment
      requests within 7 days by email to support with subject Duplicate payment return, registered email, and receipt;
      100% returned to same source, credited 5-7 working days after processing (card issuers may take up to 30 days),
      never cash. Internship duration may be extended up to 6 months if the learner has difficulty.'
    source: Internship Studio refund-policy help article (user-supplied)
    retrieved: 2026-10-25
    confidence: high
  - id: F10
    text: A separate Refund Guarantee Program promises the paid amount back after completing the program if attendance
      is 100% across the 90-day or selected duration, all assignments are on time, and the project is submitted
      in the last week. Its enrollment fee covers structured training, support, placement assistance, and commitment.
      Enrollment cap is 100 students per test registration, first come while registration is open; expansion is
      expected, not promised. Older URL says 75% attendance while latest text says 100%; confirm this discrepancy.
    source: Latest Internship Studio Refund Guarantee Program text and older program URL (user-supplied)
    retrieved: 2026-10-25
    confidence: medium
  - id: F11
    text: After payment, the dashboard may take up to 24 hours to update. If still missing, send the receipt/screenshot,
      registered email, and contact details to support or call; check spam for confirmation email. Double payments
      use the duplicate-payment rule.
    source: Internship Studio payment help article (user-supplied)
    retrieved: 2026-10-25
    confidence: high
  - id: F12
    text: Help center describes placement assistance, not a general guarantee. About page markets a placement guarantee
      for iStudio Plus Digital Marketing and Robotics; route those program-specific questions to a human. Site success
      stories list highest stipend Rs 35,000 and average Rs 10,797; these figures are not promises.
    source: Internship Studio help center and About page (user-supplied)
    retrieved: 2026-10-25
    confidence: medium
  - id: F13
    text: An extension exists up to 6 months; charges and process are unknown.
    source: Internship Studio refund-policy help article (user-supplied)
    retrieved: 2026-10-25
    confidence: low
  - id: F14
    text: 'Help-center taxonomy: Internship related 17, Certificates 8, Payment related 8, Skill 4, Extension 4,
      Placement Assistance 5, Offer Letter 3, Project 5, iCAT 15, Curriculum 1, Internship Simulation 4, Refund
      Program 12, Referral 4. Supplied article titles include enrollment, second internship and payment, batch/domain
      changes, portal access, benefits, offer letters, certificates, extensions, iCAT eligibility and exam support,
      attendance, project submission, installments, extra fees, hiring portal, assignments, and four referral topics.
      Titles without retrieved answers remain pending and must not be answered as verified facts.'
    source: Internship Studio help-center taxonomy and article titles (user-supplied)
    retrieved: 2026-10-25
    confidence: high
  - id: F15
    text: 'Help-center article ratings supplied: refund policy 23/186 likes; internship charges 603/856; placement
      guarantee 103/163.'
    source: Internship Studio help-center rating counts (user-supplied)
    retrieved: 2026-10-25
    confidence: high
  - id: F16
    text: 'Public sentiment is mixed: one Glassdoor intern review alleges a Rs 980 access fee and vague guidance;
      other reviews/Quora praise the training-to-hiring-portal flow; a third-party blog warns of name confusion
      with a different Chennai company. These are unverified third-party statements, not company facts; do not assert
      them or disparage other businesses.'
    source: Glassdoor, Quora, and a third-party blog as described by the user; not independently verified and not
      used for answers
    retrieved: 2026-10-25
    confidence: low
  - id: F17
    text: Customers include engineering, commerce/management, pharmaceutical and psychology learners, freshers,
      and campus ambassadors; many are Tier-2/3 and first-to-third year. Employers use hire.internshipstudio.com
      and can contact hr@internshipstudio.com. Employer enquiries are out of scope for the bot and routed to a human.
    source: Internship Studio site and help center (user-supplied)
    retrieved: 2026-10-25
    confidence: high
  - id: F18
    text: The help-center index lists its home page and category links for internships, certificates, payments, skills,
      extensions, placement assistance, offer letters, projects, iCAT, curriculum, internship simulation, refunds,
      and referrals.
    source: help center index
    retrieved: 2026-10-26
    confidence: high
  policies:
  - id: P1
    text: For safety, advise users to verify requests to pay outside the official site with support first and never
      share OTP or card details in chat. Ask which batch they are in before answering a refund question.
    source: User-provided customer-safety and conversation policy for this assignment
    retrieved: 2026-10-25
    confidence: high
